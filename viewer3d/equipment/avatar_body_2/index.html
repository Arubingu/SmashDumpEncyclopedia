function applyClip(clip,elapsed,facialOnly=false,visibilityScope='body'){if(!clip)return;const frame=elapsed*clip.sample_rate,i=Math.min(clip.samples.length-1,Math.max(0,Math.floor(frame))),j=Math.min(clip.samples.length-1,i+1),a=clamp(frame-i),A=clip.samples[i],B=clip.samples[j];for(const tr of clip.tracks){const value=k=>A[tr.start+k]+(B[tr.start+k]-A[tr.start+k])*a;if(tr.facial_index!==undefined){for(const mesh of facialMeshes){if(mesh.morphTargetInfluences&&tr.facial_index<mesh.morphTargetInfluences.length)mesh.morphTargetInfluences[tr.facial_index]=value(0)/100}continue}if(facialOnly)continue;if(tr.type_id===25&&tr.property==='m_Enabled'&&tr.path&&rendererMeshes[tr.path]){const enabled=value(0)>.5;for(const mesh of rendererMeshes[tr.path]){const role=mesh.userData.part?.role,isEquipment=!!mesh.userData.part?.__equipment;if(visibilityScope==='body'&&isEquipment)continue;if(visibilityScope==='weapon'&&role!=='weapon')continue;mesh.visible=enabled}continue}if(tr.type_id!==4||!tr.path||!allNodes[tr.path])continue;for(const n of allNodes[tr.path]){if(tr.property==='position')n.position.set(value(0),value(1),value(2));else if(tr.property==='scale'){const sx=value(0),sy=value(1),sz=value(2);n.scale.set(sx,sy,sz);for(const child of n.children){if(child.userData.part?.role==='weapon'&&child.userData.part?.__presentation)child.scale.set(1/Math.max(.000001,sx),1/Math.max(.000001,sy),1/Math.max(.000001,sz))}}else if(tr.property==='rotation'){const q1=new THREE.Quaternion(A[tr.start],A[tr.start+1],A[tr.start+2],A[tr.start+3]).normalize(),q2=new THREE.Quaternion(B[tr.start],B[tr.start+1],B[tr.start+2],B[tr.start+3]).normalize();n.quaternion.copy(q1.slerp(q2,a))}}}}
