function updateStatus(){const actionLabel=mode==='action'?currentAction.label:'Raw clip',phase=mode==='action'&&currentAction.clips.length>1?` · phase ${sequenceIndex+1}/${currentAction.clips.length}`:'';$('status').innerHTML=`<b>${actionLabel}</b>${phase}<br><code>${currentClip.name}</code> · ${currentClip.duration.toFixed(3)}s · ${currentClip.loop?'loop source':'one-shot source'}<br>Visible renderers: <b>${allMeshes.filter(m=>m.visible).length}/${allMeshes.length}</b>${forceRenderers?' · forced all ON':''}`}
$('action').addEventListener('change',()=>startAction($('action').value));$('playRaw').onclick=()=>startRaw($('raw').value);$('toggle').onclick=$('pause').onclick=()=>{if(!currentClip)return;playing=!playing;holdFinished=false;last=performance.now()/1000;syncPauseLabel()};$('restart').onclick=()=>startAction($('action').value);$('stop').onclick=()=>{if(!currentClip)return;playing=false;holdFinished=true;elapsed=0;resetModel();applyClip(currentClip,0);syncPauseLabel()};$('renderers').onclick=()=>{forceRenderers=!forceRenderers;resetModel();if(currentClip)applyClip(currentClip,Math.min(elapsed,currentClip.duration));updateStatus()};await startAction(idleAction.id);
function frame(nowMs){renderRaf=0;if(!isRunning())return;const interval=1000/targetFps();if(!nextRenderMs)nextRenderMs=nowMs;if(nowMs+.5<nextRenderMs){scheduleFrame();return}nextRenderMs+=interval;if(nowMs-nextRenderMs>interval)nextRenderMs=nowMs+interval;const now=nowMs/1000,dt=Math.max(0,Math.min(.1,now-last));last=now;if(playing&&!holdFinished&&currentClip&&!transitioning){elapsed+=dt;if(elapsed>=currentClip.duration){transitioning=true;finishClip().finally(()=>{transitioning=false;last=performance.now()/1000})}else applyClip(currentClip,elapsed)}$('progress').style.width=currentClip?`${Math.min(100,(elapsed/Math.max(.0001,currentClip.duration))*100)}%`:'0%';for(const sprite of particleSprites){const ps=sprite.userData.ps,life=Math.max(.001,ps.lifetime),sim=Math.max(.0001,ps.simulation_speed||1),prewarm=ps.looping&&ps.prewarm?sprite.userData.phaseSeed*life:0,rawAge=(now-particleEpoch)*sim+prewarm-sprite.userData.spawnOffset;let phase,age;if(ps.looping){phase=((rawAge/life)%1+1)%1;age=phase*life;sprite.visible=ps.play_on_awake!==false}else{age=rawAge;phase=age/life;sprite.visible=ps.play_on_awake!==false&&phase>=0&&phase<=1;if(!sprite.visible)continue}const angle=sprite.userData.phaseSeed*39.478+phase*.8,spread=ps.shape_enabled?ps.shape_radius:0,rise=particleRise(ps,age,phase);if(sprite.userData.isBubble){const emitter=sprite.userData.emitter,radial=.35+.65*phase;emitter.updateWorldMatrix(true,false);emitter.getWorldPosition(particleOrigin);emitter.getWorldScale(particleWorldScale);const fit=(Math.abs(particleWorldScale.x)+Math.abs(particleWorldScale.y)+Math.abs(particleWorldScale.z))/3;particleTarget.copy(particleOrigin).add(new THREE.Vector3(0,(rise+Math.sin(angle*1.7)*.025)*fit,0));sprite.position.copy(emitter.worldToLocal(particleTarget));sprite.position.x+=Math.sin(angle)*spread*radial;sprite.position.z+=Math.cos(angle)*spread*radial;}else if(sprite.userData.isFire)sprite.position.set(Math.sin(angle)*spread*(.25+phase*.75),rise,Math.cos(angle)*spread*(.25+phase*.75));else sprite.position.set(Math.sin(angle)*spread,rise,Math.cos(angle)*spread);const s=particleScale(ps,phase,sprite.userData.baseScale);sprite.scale.set(Math.max(.01,s[0]),Math.max(.01,s[1]),Math.max(.01,s[2]));setParticleFrame(sprite,phase);const c=particleColour(ps,phase);if(sprite.material.uniforms){sprite.material.uniforms.particleColor.value.set(c[0],c[1],c[2],Math.max(0,c[3]??1));sprite.material.uniforms.time.value=age}}controls.update();renderer.render(scene,camera);scheduleFrame()}scheduleFrame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();applyDpr()});
