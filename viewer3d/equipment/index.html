<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipment presentation</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#10141a;color:#eef3fa;font:14px system-ui}iframe{border:0;width:100%;height:100%}.panel{position:fixed;z-index:2;left:16px;top:16px;width:min(470px,calc(100% - 32px));padding:13px;background:#171d25ed;border:1px solid #3b4859;border-radius:13px;box-sizing:border-box}.controls-toggle{position:absolute;right:13px;top:13px;z-index:3;cursor:pointer}.panel.controls-collapsed{width:auto;padding:0;border:0;background:transparent;backdrop-filter:none}.panel.controls-collapsed>:not(.controls-toggle){display:none!important}.panel.controls-collapsed .controls-toggle{position:static}.title-row{display:flex;padding-right:112px;align-items:center;justify-content:space-between;gap:12px}h1{font-size:20px;margin:0}.action-count{font-size:11px;color:#9ce9bd;background:#173a2b;border-radius:999px;padding:4px 9px;white-space:nowrap}.meta{color:#aeb8c7;margin-top:4px}.row{display:flex;gap:8px;margin-top:9px;align-items:end}.row label{display:grid;gap:3px;flex:1;color:#aeb8c7;font-size:12px}select,button{min-width:0;background:#202936;color:#fff;border:1px solid #42516a;border-radius:8px;padding:7px 9px}.playback button{min-width:72px;cursor:pointer}.performance label{display:flex;align-items:center;gap:6px}.performance select{min-width:76px}.hint{position:fixed;z-index:2;right:12px;bottom:12px;color:#b8c1cf;background:#171d25cc;border:1px solid #364152;border-radius:9px;padding:7px 9px;font-size:12px}@media(max-width:600px){.panel{left:10px;top:64px;width:calc(100% - 20px);padding:11px}.config{display:grid;grid-template-columns:1fr}.playback{display:grid;grid-template-columns:repeat(3,1fr)}.playback button{min-width:0}.performance{display:grid;grid-template-columns:1fr 1fr}.hint{left:10px;text-align:center}}</style></head>
<body><div class="panel" id="controlsPanel"><button class="controls-toggle" id="controlsToggle" type="button" aria-expanded="true">Hide controls</button><div class="title-row"><h1 id="title">Loading equipment…</h1><span class="action-count" id="actionCount">Loading…</span></div><div class="meta" id="meta"></div><div class="row config"><label id="modeLabel">View mode<select id="mode"><option value="equipment">Equipment only</option><option value="mannequin">On mannequin</option></select></label><label id="bodyLabel" style="display:none">Mannequin body<select id="body"></select></label><label id="animLabel" style="display:none">Action<select id="animation"></select></label></div><div class="row playback" id="playback" style="display:none"><button id="pause" type="button">Pause</button><button id="restart" type="button">Restart</button><button id="stop" type="button">Stop</button></div><div class="row performance"><label>FPS<select id="fps"><option value="auto">Auto</option><option value="60">60 FPS</option><option value="30">30 FPS</option></select></label><label>DPR<select id="dpr"><option value="auto">Auto</option><option value="1">1×</option><option value="2">2×</option></select></label></div></div><iframe id="viewer" title="3D equipment viewer" style="visibility:hidden"></iframe><div class="hint">Drag: orbit · Wheel/pinch: zoom</div>
<script type="module">
const $=selector=>document.querySelector(selector),controlsPanel=$('#controlsPanel'),controlsToggle=$('#controlsToggle');controlsToggle.onclick=()=>{const collapsed=controlsPanel.classList.toggle('controls-collapsed');controlsToggle.textContent=collapsed?'Show controls':'Hide controls';controlsToggle.setAttribute('aria-expanded',String(!collapsed))};
const qPage=new URLSearchParams(location.search),kind=qPage.get('kind'),itemId=qPage.get('id'),index=await fetch('./index.json?release=00b59751098542bc',{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error(`equipment index HTTP ${r.status}`);return r.json()}),d=index.entities?.[`${kind}:${itemId}`];if(!d)throw new Error(`Unknown equipment entity ${kind}:${itemId}`);const mode=$('#mode'),body=$('#body'),animation=$('#animation'),viewer=$('#viewer'),pause=$('#pause'),fps=$('#fps'),dpr=$('#dpr'),decodeLabel=value=>{const node=document.createElement('textarea');node.innerHTML=String(value||'');return node.value};let active=true,paused=false;
const displayLabel=decodeLabel(d.label);document.title=displayLabel;document.querySelector('#title').textContent=displayLabel;document.querySelector('#meta').textContent=`${d.kind} · ${d.model||d.slot} · source-backed materials and outlines`;
for(const key of Object.keys(d.body_presentations)){const o=document.createElement('option');o.value=key;o.textContent=`Body type ${key}`;body.appendChild(o)}
const armorPresentations=bodyType=>[{id:'cmn_mannequin_M_g0_01_lp',label:'Neutral mannequin pose'},{id:'cmn_homeIdleA_M_g0_01_lp',label:'Relaxed idle'},{id:'cmn_homeIdleB_M_g0_01_lp',label:'Idle variation 2'},{id:'cmn_homeIdleC_M_g0_01_lp',label:'Idle variation 3'},{id:'cmn_profilePose_M_g0_01_lp',label:'Profile pose'},{id:`cmn_resultIdle_M_g${bodyType}_01_lp`,label:'Victory idle'}];
function animationRows(){return d.kind==='weapon'?(d.body_presentations[body.value]||[]).filter(row=>!/thumbnail/i.test(row.id||row.technical_name||'')):armorPresentations(body.value)}
function fillAnimations(){animation.replaceChildren();const rows=animationRows(),count=Math.max(1,rows.length),mannequinMode=mode.value==='mannequin';if(!rows.length){const o=document.createElement('option');o.value='cmn_mannequin_M_g0_01_lp';o.textContent='Neutral mannequin pose';animation.appendChild(o)}else for(const row of rows){const o=document.createElement('option');o.value=row.id;o.textContent=row.label;o.title=row.technical_name;animation.appendChild(o)}$('#actionCount').textContent=mannequinMode?`${count} action${count===1?'':'s'}`:'3D model';$('#animLabel').style.display=mannequinMode?'grid':'none';$('#playback').style.display=mannequinMode?'':'none';body.parentElement.style.display=mannequinMode?'grid':'none'}
function refresh(){const mannequinMode=mode.value==='mannequin',q=new URLSearchParams({embedded:'1',expression:'auto',weaponClip:'none',head:'none',upper:'starter',lower:'starter',shield:'none',weapon:'none',bodyClip:mannequinMode?animation.value:'cmn_mannequin_M_g0_01_lp',viewerRevision:'00b59751098542bc'});q.set(mannequinMode?'mannequin':'equipmentOnly','1');if(d.kind==='weapon')q.set('weapon',String(d.item_id));else q.set(d.slot,String(d.item_id));viewer.style.visibility='hidden';viewer.src=`./avatar_body_${body.value}/index.html?${q}`}
function applyState(){const mannequinMode=mode.value==='mannequin';viewer.contentWindow?.postMessage({type:'smashdump-equipment-state',mannequin:mannequinMode,equipmentOnly:!mannequinMode,bodyType:Number(body.value),bodyClip:mannequinMode?animation.value:'cmn_mannequin_M_g0_01_lp'},location.origin)}
async function changeAnimationWithoutReload(){for(let attempt=0;attempt<50;attempt++){const select=viewer.contentDocument?.querySelector('#bodyClip'),FrameEvent=viewer.contentWindow?.Event;if(select&&!select.disabled&&FrameEvent&&[...select.options].some(o=>o.value===animation.value)){select.value=animation.value;select.dispatchEvent(new FrameEvent('change',{bubbles:true}));return}await new Promise(resolve=>setTimeout(resolve,100))}refresh()}
function settings(next={}){if(next.active!==undefined)active=!!next.active;if(next.paused!==undefined){paused=!!next.paused;pause.textContent=paused?'Resume':'Pause'}viewer.contentWindow?.postMessage({type:'smashdump-viewer-settings',active,paused,fps:fps.value,dpr:dpr.value,...next},location.origin)}
async function restart({resume=true}={}){for(let attempt=0;attempt<50;attempt++){const select=viewer.contentDocument?.querySelector('#bodyClip'),FrameEvent=viewer.contentWindow?.Event;if(select&&FrameEvent){select.dispatchEvent(new FrameEvent('change',{bubbles:true}));settings({paused:!resume});return}await new Promise(resolve=>setTimeout(resolve,100))}}
mode.onchange=()=>{fillAnimations();paused=false;pause.textContent='Pause';applyState();settings({paused:false})};body.onchange=()=>{fillAnimations();paused=false;pause.textContent='Pause';applyState();settings({paused:false})};animation.onchange=()=>{paused=false;pause.textContent='Pause';applyState();settings({paused:false})};pause.onclick=()=>settings({paused:!paused});$('#restart').onclick=()=>restart({resume:true});$('#stop').onclick=()=>restart({resume:false});fps.onchange=()=>settings();dpr.onchange=()=>settings();viewer.addEventListener('load',()=>settings());fillAnimations();refresh();
addEventListener('message',event=>{if(event.source===viewer.contentWindow&&event.data?.type==='smashdump-viewer-ready'){viewer.style.visibility='visible';settings();return}if(event.data?.type==='smashdump-viewer-settings'){if(event.data.fps!==undefined)fps.value=String(event.data.fps);if(event.data.dpr!==undefined)dpr.value=String(event.data.dpr);settings(event.data)}});
</script></body></html>
